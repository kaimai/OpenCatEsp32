name: python-api
on:
  push:
    paths: ["python/**", ".github/workflows/python-api.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python-api.yml"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v -W error::DeprecationWarning --cov=petoi --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - name: Wheel works in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ "$RUNNER_OS" = "Windows" ]; then VBIN="$RUNNER_TEMP/clean/Scripts"; else VBIN="$RUNNER_TEMP/clean/bin"; fi
          "$VBIN/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$VBIN/petoi" send "?" --to mock
  oldest-websockets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -e ".[dev]" "websockets==13.*"
      - run: python -c "import websockets, sys; print(websockets.__version__); sys.exit(not websockets.__version__.startswith('13.'))"
      - run: pytest -v -W error::DeprecationWarning
